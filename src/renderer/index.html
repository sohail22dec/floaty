<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
    <title>Floating Cam</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <div id="app">
      <!-- Toolbar -->
      <div class="toolbar" id="drag-region" role="toolbar" aria-label="Floating Cam Controls">
        <span class="title">Floating Cam</span>
        <button id="toggleBtn" title="Toggle Controls" aria-label="Toggle Controls" class="toggle-btn">
          ⚙️
        </button>
      </div>

      <!-- Main content area -->
      <div id="contentArea">
        <video id="video" autoplay playsinline muted></video>
        
        <!-- Loading overlay (created dynamically) -->
        
        <!-- Error messages (created dynamically) -->
      </div>

      <!-- Controls Overlay -->
      <div id="controlsOverlay" class="controls-overlay" hidden>
        <div class="overlay-content">
          <div class="overlay-header">
            <h3>Controls</h3>
            <button id="closeOverlayBtn" class="close-btn" aria-label="Close">×</button>
          </div>
          
          <div class="controls-grid">
            <button id="flipBtn" title="Flip Horizontal" aria-label="Flip Horizontal" class="control-btn">
              <span class="icon">🔄</span>
              <span>Flip</span>
            </button>
            
            <button id="circleBtn" title="Toggle Circle" aria-label="Toggle Circle" class="control-btn">
              <span class="icon">⭕</span>
              <span>Circle</span>
            </button>
            
            <button id="opacityBtn" title="Cycle Opacity" aria-label="Cycle Opacity" class="control-btn">
              <span class="icon">👁️</span>
              <span>Opacity</span>
            </button>
            
            <button id="settingsBtn" title="Resize / Settings" aria-label="Resize / Settings" class="control-btn">
              <span class="icon">📐</span>
              <span>Size</span>
            </button>
          </div>

          <!-- Border radius control -->
          <div class="radius-control">
            <label for="radiusRange">Border Radius</label>
            <input id="radiusRange" type="range" min="0" max="50" value="16" title="Border Radius %" aria-label="Border Radius" />
            <span id="radiusValue">16%</span>
          </div>

          <!-- Device selection (will be populated dynamically) -->
          <div id="deviceSelection" class="device-selection" style="display: none;">
            <label for="deviceSelect">Camera:</label>
            <select id="deviceSelect" aria-label="Select Camera">
              <option value="">Select camera...</option>
            </select>
          </div>

          <!-- Size Panel -->
          <div id="sizePanel" class="size-panel" hidden>
            <div class="panel-header">
              <h4>Window Size</h4>
            </div>
            
            <div class="row dims">
              <label for="widthInput">W</label>
              <input id="widthInput" type="number" min="160" step="10" aria-label="Width" />
              <label for="heightInput">H</label>
              <input id="heightInput" type="number" min="160" step="10" aria-label="Height" />
              <button id="applySizeBtn" aria-label="Apply Size">Apply</button>
            </div>
            
            <div class="presets row">
              <button data-preset="1:1" title="Square (1:1)">1:1</button>
              <button data-preset="4:3" title="Standard (4:3)">4:3</button>
              <button data-preset="16:9" title="Widescreen (16:9)">16:9</button>
              <button data-preset="9:16" title="Portrait (9:16)">9:16</button>
            </div>
          </div>

          <!-- Quick actions -->
          <div class="quick-actions">
            <button id="snapshotBtn" title="Take Snapshot" aria-label="Take Snapshot" class="action-btn">
              📸 Snapshot
            </button>
            <button id="preferencesBtn" title="Preferences" aria-label="Preferences" class="action-btn">
              ⚙️ Preferences
            </button>
          </div>
        </div>
      </div>

      <!-- Resize handle -->
      <div id="resizeHandle" aria-label="Resize Handle" title="Drag to resize"></div>
      
      <!-- Status indicator -->
      <div id="statusIndicator" class="status-indicator" style="display: none;">
        <span id="statusText"></span>
      </div>
    </div>

    <!-- Load modular scripts -->
    <script src="camera-manager.js"></script>
    <script src="ui-controller.js"></script>
    <script src="settings-manager.js"></script>
    <script src="app.js"></script>
  </body>
</html>
