<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Floating Cam</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div
        class="toolbar"
        id="drag-region"
        role="toolbar"
        aria-label="Floating Cam Controls"
      >
        <span class="title">Floating Cam</span>
        <button
          id="toggleBtn"
          title="Toggle Controls"
          aria-label="Toggle Controls"
          class="toggle-btn"
        >
          ⚙️
        </button>
      </div>
      <div id="contentArea">
        <video id="video" autoplay playsinline muted></video>
      </div>

      <!-- Controls Overlay -->
      <div id="controlsOverlay" class="controls-overlay" hidden>
        <div class="overlay-content">
          <div class="overlay-header">
            <h3>Controls</h3>
            <button id="closeOverlayBtn" class="close-btn">×</button>
          </div>
          <div class="controls-grid">
            <button
              id="flipBtn"
              title="Flip Horizontal"
              aria-label="Flip Horizontal"
            >
              <span class="icon">🔄</span>
              <span>Flip</span>
            </button>
            <button
              id="circleBtn"
              title="Toggle Circle"
              aria-label="Toggle Circle"
            >
              <span class="icon">⭕</span>
              <span>Circle</span>
            </button>
            <button
              id="opacityBtn"
              title="Cycle Opacity"
              aria-label="Cycle Opacity"
            >
              <span class="icon">👁️</span>
              <span>Opacity</span>
            </button>
            <button
              id="settingsBtn"
              title="Resize / Settings"
              aria-label="Resize / Settings"
            >
              <span class="icon">📐</span>
              <span>Size</span>
            </button>
          </div>
          <div class="radius-control">
            <label for="radiusRange">Border Radius</label>
            <input
              id="radiusRange"
              type="range"
              min="0"
              max="50"
              value="16"
              title="Border Radius %"
              aria-label="Border Radius"
            />
            <span id="radiusValue">16%</span>
          </div>

          <!-- Size Panel inside overlay -->
          <div id="sizePanel" class="size-panel" hidden>
            <div class="panel-header">
              <h4>Window Size</h4>
            </div>
            <div class="row dims">
              <label for="widthInput">W</label>
              <input id="widthInput" type="number" min="160" step="10" />
              <label for="heightInput">H</label>
              <input id="heightInput" type="number" min="160" step="10" />
              <button id="applySizeBtn" aria-label="Apply Size">Apply</button>
            </div>
            <div class="presets row">
              <button data-preset="1:1">1:1</button>
              <button data-preset="4:3">4:3</button>
              <button data-preset="16:9">16:9</button>
              <button data-preset="9:16">9:16</button>
            </div>
          </div>
        </div>
      </div>
      <div id="resizeHandle" aria-label="Resize Handle"></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
